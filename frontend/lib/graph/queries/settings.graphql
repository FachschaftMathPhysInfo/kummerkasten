query allSettings {
    settings {
        key
        value
    }
}

query footerSettings {
    footerSettings {
        key
        value
    }
}

query aboutSectionSettings {
    aboutSectionSettings {
        key
        value
    }
}

query frontendConfig {
    frontendConfig {
        ... on StringConfiguration {
            key
            stringValue
        }
        ... on IntConfiguration {
            key
            intValue
        }
    }
}